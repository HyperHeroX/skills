apiVersion: ai-essd/v4.4
kind: MandatorySystemRequirementPolicy
metadata:
  name: user-mandatory-system-requirements
  version: 4.4.0
  baselineDate: '2026-08-09'
  source: requirements/USER_MANDATORY_REQUIREMENTS_BASELINE.md
  baselineDigest: 77478e2a918e6dc7984f79534abcd5415cdbb07bb2c7de2346aceb03e5484f4f
spec:
  defaultDecision: deny-unregistered-or-downgraded-requirement
  authority: human-requirement-owner
  changeControl: requirements/REQUIREMENT_CHANGE_CONTROL.md
  requirementStateFile: .ai/system-requirements.yaml
  requirementStateSchema: .ai/schemas/SYSTEM_REQUIREMENT_STATE.schema.json
  allowedMaturityStates:
  - registered
  - specified
  - designed
  - implemented
  - verified
  - operational
  - maintained
  - retired
  - blocked
  - condition-not-triggered
  forbiddenRequirementStates:
  - deferred
  - disabled
  - not-applicable
  - optional
  - capability-ready
  rules:
    allRequirementsAreMandatory: true
    onlySourceExplicitConditionsAllowed: true
    lifecycleChangesDepthNotExistence: true
    runtimeFeatureOffDoesNotMeanRequirementIncomplete: true
    externalStandardsAreSupplementOnly: true
    builderCannotApproveOwnConformance: true
    anySemanticDeviationBlocks: true
  requirements:
  - id: ARCH-REQ-001
    category: 架構類
    title: 多租戶
    strength: MUST
    sourceText: 系統預設具多租戶，但由管理者決定是否開啟。除非有特別要求硬體隔離，否則一律採用軟體隔離方式。隔離中的所有資料只能由管理者進行查探。
    sourceCondition: null
    profiles: &id001
    - profiles/ARCHITECTURE_SYSTEM_PROFILE.md
    requiredReviewers:
    - Architecture
    - Security
    - Data
    - Requirement Conformance
    minimumEvidence:
    - tenant model
    - admin enable/disable setting
    - software isolation tests
    - cross-tenant admin audit tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: ARCH-REQ-002
    category: 架構類
    title: 設計模式
    strength: MUST
    sourceText: 系統從分析階段時就必須考慮使用最佳的模式，例如訂閱者模式使用在滿足即時事件顯示
    sourceCondition: null
    profiles: *id001
    requiredReviewers:
    - Architecture
    - Requirement Conformance
    minimumEvidence:
    - analysis record
    - pattern decision record
    - implementation and tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_CONSIDER_AND_RECORD
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: ARCH-REQ-003
    category: 架構類
    title: 依賴注入／控制反轉
    strength: MUST
    sourceText: 在系統開發過程中，解耦是重要的事情，因此除非該語言特性無法滿足，否則都應該將DI/IoC作為首要目標。
    sourceCondition: 除非該語言特性無法滿足
    profiles: *id001
    requiredReviewers:
    - Architecture
    - Domain Specialist
    - Requirement Conformance
    minimumEvidence:
    - dependency graph
    - DI/IoC configuration
    - unit tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_UNLESS_SOURCE_EXCEPTION
    conditionMode: exception
    conditionNotTriggeredAllowed: false
  - id: ARCH-REQ-004
    category: 架構類
    title: 事件匯流機制
    strength: MUST
    sourceText: 用事件匯流機制來實現發布與訂閱模式，用來集中處理事件，並解耦組件之間通訊依賴。
    sourceCondition: null
    profiles: *id001
    requiredReviewers:
    - Architecture
    - Reliability
    - Security
    - Requirement Conformance
    minimumEvidence:
    - event catalog
    - event bus implementation
    - publish/subscribe tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: ARCH-REQ-005
    category: 架構類
    title: 模組化設計
    strength: MUST
    sourceText: 所有功能必須以模組化方式進行設計，且必須有一個設計規範來讓其他開發者遵循，設計規範必須寫在 docs中
    sourceCondition: null
    profiles: *id001
    requiredReviewers:
    - Architecture
    - General Review
    - Requirement Conformance
    minimumEvidence:
    - module boundaries
    - docs design standard
    - dependency tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: ARCH-REQ-006
    category: 架構類
    title: IPC
    strength: MUST
    sourceText: 程式間通訊
    sourceCondition: null
    profiles: *id001
    requiredReviewers:
    - Architecture
    - Security
    - Platform Specialist
    - Requirement Conformance
    minimumEvidence:
    - IPC contract
    - authentication/authorization tests
    - compatibility tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: ARCH-REQ-007
    category: 架構類
    title: 異常管理
    strength: MUST
    sourceText: 異常事件發生時必須能夠記錄異常詳細資訊，並提供用戶不含重要或敏感內容的異常簡要資訊，所有種類的異常必須編制一個異常對應表在docs，並在開發過程中逐漸添加。
    sourceCondition: null
    profiles: *id001
    requiredReviewers:
    - General Review
    - Security
    - Operations
    - Requirement Conformance
    minimumEvidence:
    - structured error logs
    - sanitized user error tests
    - docs/exception-matrix.md
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: ARCH-REQ-008
    category: 架構類
    title: 工作者服務模式
    strength: MUST
    sourceText: 如系統需要一個脫離宿主不隨著宿主啟動而啟動、結束就跟著結束的陪伴或監測機制就應該使用此模式。
    sourceCondition: 如系統需要脫離宿主生命週期的陪伴或監測機制
    profiles: *id001
    requiredReviewers:
    - Architecture
    - Reliability
    - Security
    - Requirement Conformance
    minimumEvidence:
    - worker design
    - independent lifecycle tests
    - shutdown/recovery tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_WHEN_SOURCE_CONDITION
    conditionMode: trigger
    conditionNotTriggeredAllowed: true
  - id: ARCH-REQ-009
    category: 架構類
    title: API 文件
    strength: MUST
    sourceText: 必須符合openapi格式，系統管理者應該且必須了解並測試、使用API，因此必須建立可操作的頁面。
    sourceCondition: null
    profiles: *id001
    requiredReviewers:
    - API Specialist
    - Security
    - Frontend
    - Requirement Conformance
    minimumEvidence:
    - OpenAPI artifact
    - interactive API page
    - administrator authorization tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: SEC-REQ-001
    category: 資安類
    title: RBAC
    strength: MUST
    sourceText: 所有頁面中可以執行特定功能的元件都必須被RBAC支配。
    sourceCondition: null
    profiles: &id002
    - profiles/SECURITY_IDENTITY_PROFILE.md
    requiredReviewers:
    - Security
    - Identity
    - Frontend
    - Requirement Conformance
    minimumEvidence:
    - permission catalog
    - UI permission tests
    - server authorization tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: SEC-REQ-002
    category: 資安類
    title: 最小權限
    strength: MUST
    sourceText: 所有帳號建立時都必須是最小權限，且不能自行提權。最高權限管理者必須在系統第一次啟動時進行帳號密碼設定。
    sourceCondition: null
    profiles: *id002
    requiredReviewers:
    - Security
    - Identity
    - Requirement Conformance
    minimumEvidence:
    - default role tests
    - privilege escalation negative tests
    - first-boot bootstrap test
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: SEC-REQ-003
    category: 資安類
    title: 二階段認證
    strength: MUST
    sourceText: 系統必須支援2FA、Authenticator、PassKey、Email Verify Code等各種二階段認證，且可由使用者自行決定是否開啟，但當系統管理者在系統管理選項中選擇所有人都必須開啟時，使用者2FA設定失效並繼承來自管理的設定。
    sourceCondition: null
    profiles: *id002
    requiredReviewers:
    - Security
    - Identity
    - Frontend
    - Requirement Conformance
    minimumEvidence:
    - factor enrollment flows
    - user setting tests
    - administrator inheritance tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: SEC-REQ-004
    category: 資安類
    title: 越權稽核
    strength: MUST
    sourceText: 管理者進行租戶行為、資料、操作、Log等越過租戶特權的查探操作時必須留下相應記錄。
    sourceCondition: 發生管理者跨租戶特權查探
    profiles: *id002
    requiredReviewers:
    - Security
    - Audit
    - Data
    - Requirement Conformance
    minimumEvidence:
    - privileged inspection audit
    - tamper protection
    - negative tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_WHEN_SOURCE_CONDITION
    conditionMode: trigger
    conditionNotTriggeredAllowed: true
  - id: SEC-REQ-005
    category: 資安類
    title: 安全權限
    strength: MUST
    sourceText: 系統權限授權主要使用Token作為主要鑑權方式，OAuth作為第二選項，OAuth需能滿足市場前五名的授權來源。
    sourceCondition: null
    profiles: *id002
    requiredReviewers:
    - Security
    - Identity
    - API
    - Requirement Conformance
    minimumEvidence:
    - token authentication tests
    - OAuth provider adapters
    - provider compatibility matrix
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: SEC-REQ-006
    category: 資安類
    title: CORS
    strength: MUST
    sourceText: 基本安全功能，必須具備，且必須可以在系統中自行設定。
    sourceCondition: null
    profiles: *id002
    requiredReviewers:
    - Security
    - Frontend
    - API
    - Requirement Conformance
    minimumEvidence:
    - CORS configuration page
    - origin policy tests
    - audit log
    lifecycleTargets:
      L0-MVP: specified
