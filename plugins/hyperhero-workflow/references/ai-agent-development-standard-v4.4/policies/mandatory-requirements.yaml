    - restart/resume tests
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: DATA-REQ-002
    category: 資料類
    title: 資料加密
    strength: MUST
    sourceText: 對於可能對於個人隱私洩漏或機密資料或應保護之欄位進行加密，加密金鑰分為管理員金鑰，用來加密租戶資料；租戶金鑰用來加密租戶的客戶資料；客戶金鑰用來加密自己的資料。每一種角色持有的金鑰在帳號建立時就必須建立，並提示由帳號擁有者自行保存，顯示後離開該頁面即不顯示，金鑰存於資料庫中但由上級管理者加密，若無租戶則是系統管理者的金鑰加密，系統管理者的金鑰儲存於環境變數。
    sourceCondition: null
    profiles: *id003
    requiredReviewers:
    - Security
    - Crypto
    - Data
    - Frontend
    - Requirement Conformance
    minimumEvidence:
    - key hierarchy design
    - account key generation tests
    - display-once tests
    - wrapped-key storage tests
    - environment root-key test
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
