    category: 資料類
    title: 資料驗證
    strength: MUST
    sourceText: 系統運作過程中對於輸入或輸出的資料進行合法性與完整性檢查，確保符合業務規則與系統預期，防止無效、惡意或格式錯誤的資料進入核心邏輯。採用鏈式驗證。
    sourceCondition: null
    profiles: *id003
    requiredReviewers:
    - Security
    - Data
    - API
    - Requirement Conformance
    minimumEvidence:
