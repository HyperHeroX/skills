    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: SEC-REQ-007
    category: 資安類
    title: 系統日誌
    strength: MUST
    sourceText: 記錄系統相關LOG與程式運作LOG，系統相關如操作、資料變更、事件發等，程式運作則例如程序或方法的運作、錯誤等，系統日誌必須分級。
    sourceCondition: null
    profiles: *id002
    requiredReviewers:
    - Security
    - Operations
    - Requirement Conformance
    minimumEvidence:
    - log taxonomy
    - log-level tests
    - operation/runtime log samples
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: SEC-REQ-008
    category: 資安類
    title: 資通系統防護基準
    strength: MUST
    sourceText: 系統規劃時必須符合相關規範。
    sourceCondition: null
    profiles: *id002
    requiredReviewers:
    - Security
    - Compliance
    - Requirement Conformance
    minimumEvidence:
    - applicability statement
    - control crosswalk
    - compliance evidence
    lifecycleTargets:
      L0-MVP: specified
      L1-FORMAL-PROJECT: implemented
      L2-INTERNAL-TEST: verified
      L3-PILOT: operational
      L4-GENERAL-AVAILABILITY: operational
      L5-MAINTENANCE: maintained
      L6-RETIREMENT: retired
    sourceDirective: MUST_IMPLEMENT
    conditionMode: none
    conditionNotTriggeredAllowed: false
  - id: SEC-REQ-009
    category: 資安類
    title: 隱私權
    strength: MUST
    sourceText: 除非有系統使用上的需要，否則一律不向用戶要求或記錄除帳號以外資訊，若有要求則需進行保護作業。
    sourceCondition: 僅在系統使用上有需要時蒐集帳號以外資訊
    profiles: *id002
    requiredReviewers:
