name: Stop hook compatibility

on:
  push:
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'plugins/*/hooks/hooks.json'
      - 'plugins/hyperhero-tools/scripts/ralph-setup.mjs'
      - 'plugins/*/scripts/*-stop-hook.mjs'
      - 'test/stop-hooks.test.mjs'
      - '.github/workflows/stop-hooks.yml'
  pull_request:
    paths:
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'plugins/*/hooks/hooks.json'
      - 'plugins/hyperhero-tools/scripts/ralph-setup.mjs'
      - 'plugins/*/scripts/*-stop-hook.mjs'
      - 'test/stop-hooks.test.mjs'
      - '.github/workflows/stop-hooks.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/stop-hooks.test.mjs
